<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - PINOK STAKE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #2c4a6e 0%, #1e3a5f 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; padding: 3rem; border-radius: 8px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .login-header { text-align: center; margin-bottom: 2rem; }
        .login-header h1 { color: #2c4a6e; margin-bottom: 0.5rem; }
        .login-header p { color: #8b9dc3; }
        .form-group { margin-bottom: 1.5rem; }
        label { display: block; margin-bottom: 0.5rem; color: #2c4a6e; font-weight: 600; }
        input { width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 4px; font-size: 1rem; }
        input:focus { outline: none; border-color: #ff9f43; box-shadow: 0 0 0 3px rgba(255, 159, 67, 0.1); }
        button { width: 100%; padding: 0.75rem; background: #ff9f43; color: #2c4a6e; border: none; border-radius: 4px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s; }
        button:hover { background: #ff8c1a; transform: translateY(-2px); }
        .error { color: #e74c3c; margin-top: 0.5rem; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="login-container">
    <div class="login-header">
        <h1>PINOK STAKE</h1>
        <p>Admin Login</p>
    </div>
    <form id="loginForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit">Login</button>
        <div id="error" class="error"></div>
    </form>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    
    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
        });
        
        const data = await res.json();
        if (data.token) {
            localStorage.setItem('token', data.token);
            window.location.href = '/admin/dashboard';
        } else {
            document.getElementById('error').textContent = 'Invalid credentials';
        }
    } catch (err) {
        document.getElementById('error').textContent = 'Login failed';
    }
});
</script>

</body>
</html>
